backend:
  name: git-gateway
  branch: main

# This tells Netlify Identity where your site lives.
# Without this, email confirmation links can redirect incorrectly.
site_url: https://anuj-jain-portfolio.netlify.app

# After login, go straight to the collections list
local_backend: false

media_folder: "public/images/projects"
public_folder: "/images/projects"

# Cloudinary media library integration
media_library:
  name: cloudinary
  config:
    cloud_name: "dhsqam4ce"      # ← Replace with your Cloudinary cloud name
    api_key: "249455125613471"            # ← Replace with your Cloudinary API key

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", hint: "Short descriptor e.g. 'Solo Mobile Game · Android'" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["LIVE", "CURRENT", "SHIPPED", "WIP"]
        default: "SHIPPED"
      - { label: "Platform", name: "platform", widget: "string", hint: "e.g. iOS · Android · WebGL" }
      - { label: "Studio / Type", name: "studio", widget: "string", hint: "e.g. Phonato Studios or Personal Project" }
      - { label: "Year", name: "year", widget: "string", hint: "e.g. 2022–2024" }
      - label: "Sort Order"
        name: "order"
        widget: "number"
        default: 99
        hint: "Lower number = appears first"
      - label: "Media Type"
        name: "mediaType"
        widget: "select"
        options:
          - { label: "GIF", value: "gif" }
          - { label: "MP4 Video", value: "video" }
          - { label: "YouTube Embed", value: "youtube" }
          - { label: "Screenshot / Image", value: "image" }
        default: "image"
      - label: "Media File (GIF / Image / MP4)"
        name: "mediaSrc"
        widget: "image"
        required: false
        hint: "Upload GIF or image. For MP4, use Cloudinary URL below."
      - label: "Cloudinary Video URL"
        name: "cloudinaryVideo"
        widget: "string"
        required: false
        hint: "Paste full Cloudinary MP4 URL here for video projects"
      - label: "YouTube Video ID"
        name: "youtubeId"
        widget: "string"
        required: false
        hint: "Just the ID part from the YouTube URL e.g. dQw4w9WgXcQ"
      - label: "Store / Live Link"
        name: "storeLink"
        widget: "string"
        required: false
        hint: "Google Play, App Store, or website URL"
      - { label: "Store Link Label", name: "storeLinkLabel", widget: "string", required: false, default: "View Live →" }
      - label: "GitHub Repo"
        name: "githubLink"
        widget: "string"
        required: false
      - label: "Tech Challenge"
        name: "techChallenge"
        widget: "text"
        hint: "What was the hard technical problem you solved?"
      - label: "Business Outcome"
        name: "businessOutcome"
        widget: "text"
        hint: "What shipped? What was the real-world result?"
      - label: "Code Quality Signals"
        name: "codeSignals"
        widget: "text"
        hint: "Design patterns, architecture decisions, what makes your code good?"
      - label: "Tags"
        name: "tags"
        widget: "list"
        hint: "e.g. Unity, C#, iOS, Object Pooling"
      - label: "Key Metrics"
        name: "metrics"
        widget: "list"
        hint: "e.g. '3 Platforms', 'Live on Play Store', '0ms GC during spin'"
      - label: "Accent Color"
        name: "accent"
        widget: "color"
        default: "#C8F135"
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Featured projects appear larger at the top"
